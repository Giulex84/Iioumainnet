<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07101e"><title>IIOU Activity — Mainnet</title><script src="https://sdk.minepi.com/pi-sdk.js"></script><style>:root{--bg:#07101e;--panel:#0e1a2c;--line:#223553;--text:#f7f9fc;--muted:#9db0c9;--mint:#37d4b2;--gold:#ffd166;--blue:#66a7ff;--danger:#ff7383}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}.wrap{width:min(760px,100%);margin:auto;padding:26px 14px 90px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.badge{border:1px solid var(--line);border-radius:999px;padding:8px 11px;color:var(--mint);font-size:12px;font-weight:800}.muted{color:var(--muted);line-height:1.5}.card{background:linear-gradient(145deg,#10203a,#0b1728);border:1px solid var(--line);border-radius:22px;padding:18px;margin-top:16px}.primary,.secondary,.ghost,.danger{border:0;border-radius:14px;padding:13px 15px;font-weight:800}.primary{background:var(--mint);color:#06121d}.secondary{background:#1a3150;color:var(--text);border:1px solid #2b4a71}.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}.danger{background:#3a1b28;color:#ffc0c9;border:1px solid #663142}.wide{width:100%}.hidden{display:none!important}.list{display:grid;gap:10px}.item{padding:15px;border:1px solid var(--line);border-radius:16px;background:#0a1727;cursor:pointer}.item b{font-size:18px}.amount{font-size:34px;font-weight:900}.status{font-size:12px;font-weight:900;text-transform:uppercase;color:var(--mint)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{padding:14px;border:1px solid var(--line);border-radius:16px;background:#0a1727}.metric span{color:var(--muted);font-size:12px}.metric b{display:block;margin-top:6px;font-size:20px}.receipt{border-color:#245c50;background:#0b2a24}.timeline{border-left:2px solid #29476c;margin:14px 0 0 12px;padding-left:18px}.event{position:relative;margin:0 0 22px}.event:before{content:"";position:absolute;width:12px;height:12px;border-radius:50%;background:var(--blue);left:-25px;top:5px}.event strong{display:block}.event small{display:block;color:var(--muted);margin-top:5px}.field{margin:12px 0}.field textarea,.field input{width:100%;background:#081524;color:var(--text);border:1px solid #29405f;border-radius:13px;padding:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions>*{flex:1;min-width:140px}.back{display:inline-block;margin:18px 0;color:var(--muted);text-decoration:none}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><div><h1 style="margin:0">IIOU Activity</h1><div class="muted">Details, timeline and settlement history</div></div><span class="badge">PI MAINNET</span></div><a class="back" href="/">← Back to IIOU</a><section id="loginCard" class="card"><h2>Private activity center</h2><p class="muted">Authenticate with Pi to view only IOUs connected to your verified account.</p><button id="login" class="primary wide">Continue with Pi</button></section><section id="content" class="hidden"><div id="listCard" class="card"><h2>Your IOUs</h2><div id="list" class="list"></div></div><div id="detail" class="hidden"></div></section></main><script>
Pi.init({version:'2.0',sandbox:false});let token=null,user=null,ious=[];const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>`${Number(n||0).toLocaleString(undefined,{maximumFractionDigits:7})} π`;const H=()=>({'Content-Type':'application/json',Authorization:`Bearer ${token}`});async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{...H(),...(opt.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||`Request failed (${r.status})`);return d}const label=t=>({created:'IOU created',accept:'Counterparty accepted',decline:'Counterparty declined',cancel:'IOU cancelled',claim_paid:'Debtor marked paid',confirm_paid:'Settlement confirmed',reject_payment_claim:'Payment claim rejected',note:'Shared note',partial_claimed:'Partial payment claimed',partial_confirmed:'Partial payment confirmed',partial_rejected:'Partial payment rejected'}[t]||t.replaceAll('_',' '));
async function login(){const a=await Pi.authenticate(['username'],()=>{});token=a.accessToken;const d=await api('/api/auth',{method:'POST'});user=d.user;$('loginCard').classList.add('hidden');$('content').classList.remove('hidden');await loadList();const id=new URLSearchParams(location.search).get('id');if(id)openDetail(id)}async function loadList(){const d=await api('/api/ious');ious=d.ious||[];$('list').innerHTML=ious.length?ious.map(i=>`<div class="item" onclick="openDetail('${i.id}')"><b>${fmt(i.amount)} · ${esc(i.note)}</b><div class="muted">${i.role==='debtor'?`You owe @${esc(i.creditorUsername)}`:`@${esc(i.debtorUsername)} owes you`} · ${esc(i.status)}</div>${i.dueDate?`<div style="color:var(--gold);margin-top:5px">Due ${new Date(i.dueDate+'T00:00:00').toLocaleDateString()}</div>`:''}</div>`).join(''):'<div class="muted">No IOUs yet.</div>'}async function openDetail(id){const d=await api('/api/iou-detail?id='+encodeURIComponent(id));renderDetail(d.iou);history.replaceState(null,'','/details.html?id='+encodeURIComponent(id))}window.openDetail=openDetail;
function renderDetail(i){$('listCard').classList.add('hidden');const other=i.role==='debtor'?i.creditorUsername:i.debtorUsername;const receipt=i.status==='settled'?`<div class="card receipt"><h3 style="color:var(--mint)">Settlement receipt</h3><p>Final status: Settled</p><div class="muted">Settled amount ${fmt(i.amount)}${i.settledAt?' · '+new Date(i.settledAt).toLocaleString():''}</div></div>`:'';const pending=(i.partialPayments||[]).find(p=>p.status==='claimed');const controls=[];if(i.permissions.canAddNote)controls.push(`<div class="card"><h3>Add private shared activity note</h3><div class="field"><textarea id="noteText" maxlength="240" placeholder="Add context for both participants…"></textarea></div><button class="secondary wide" onclick="postAction('${i.id}','add_note',{text:$('noteText').value})">Add note</button></div>`);if(i.permissions.canClaimPartial)controls.push(`<div class="card"><h3>Record a partial payment</h3><div class="field"><input id="partialAmount" type="number" min="0.0000001" step="0.0000001" placeholder="Amount in Pi"></div><button class="secondary wide" onclick="postAction('${i.id}','claim_partial',{amount:$('partialAmount').value})">Claim partial payment</button></div>`);if(i.permissions.canReviewPartial&&pending)controls.push(`<div class="card"><h3>Review partial payment</h3><p class="muted">${fmt(pending.amount)} claimed by @${esc(pending.claimedBy)}</p><div class="actions"><button class="primary" onclick="postAction('${i.id}','confirm_partial',{paymentId:'${pending.id}'})">Confirm</button><button class="danger" onclick="postAction('${i.id}','reject_partial',{paymentId:'${pending.id}'})">Reject</button></div></div>`);if(i.permissions.canArchive)controls.push(`<div class="card"><button class="ghost wide" onclick="postAction('${i.id}','${i.archived?'unarchive':'archive'}')">${i.archived?'Unarchive':'Archive'} this closed IOU</button></div>`);$('detail').innerHTML=`<button class="ghost wide" onclick="showList()">← All IOUs</button><div class="card"><div class="top"><div><div class="amount">${fmt(i.amount)}</div><div class="muted">${i.role==='debtor'?`You owe @${esc(other)}`:`@${esc(other)} owes you`}</div></div><span class="status">${esc(i.status)}</span></div><h2>${esc(i.note)}</h2><div class="muted">Created ${new Date(i.createdAt).toLocaleString()}${i.dueDate?' · Due '+new Date(i.dueDate+'T00:00:00').toLocaleDateString():''}</div><div class="grid" style="margin-top:16px"><div class="metric"><span>Confirmed partials</span><b>${fmt(i.paidAmount)}</b></div><div class="metric"><span>Remaining</span><b>${fmt(i.remainingAmount)}</b></div></div>${receipt}<div class="card"><h2>Activity timeline</h2><div class="timeline">${[...(i.history||[])].reverse().map(e=>`<div class="event"><strong>${esc(label(e.type))}</strong><small>${esc(e.by||'')} · ${new Date(e.at).toLocaleString()}${e.text?'<br>'+esc(e.text):''}${e.amount!=null?'<br>'+fmt(e.amount):''}</small></div>`).join('')||'<div class="muted">No activity yet.</div>'}</div></div></div>${controls.join('')}`;$('detail').classList.remove('hidden')}
async function postAction(id,action,extra={}){try{const d=await api('/api/iou-detail',{method:'POST',body:JSON.stringify({id,action,...extra})});renderDetail(d.iou)}catch(e){alert(e.message)}}window.postAction=postAction;function showList(){$('detail').classList.add('hidden');$('listCard').classList.remove('hidden');history.replaceState(null,'','/details.html')}window.showList=showList;$('login').onclick=()=>login().catch(e=>alert(e.message));
</script></body></html>
